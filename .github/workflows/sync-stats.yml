name: sync-stats

# Pulls new/changed fesabal box scores straight from the stats API into data/ (no browser).
# Runs Sunday 23:00 and Monday 07:00 El Salvador time (05:00 / 13:00 UTC) and on demand.
on:
  schedule:
    - cron: "7 5 * * 1"
    - cron: "7 13 * * 1"
  workflow_dispatch:
    inputs:
      recheck_days:
        description: "Re-download stored games newer than N days (fesabal corrections)"
        default: "14"

permissions:
  contents: write

concurrency:
  group: sync-stats
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: |
          mkdir -p logs
          python3 -u stats/sync.py --recheck-days "${{ inputs.recheck_days || '14' }}" 2>&1 | tee logs/sync-${{ github.run_id }}.txt; exit ${PIPESTATUS[0]}
      - name: Commit data + log
        if: always()
        run: |
          git config user.name "bkbfanssv-bot"; git config user.email "bkbfanssv-bot@users.noreply.github.com"
          rm -f logs/last-sync-dump.json
          git add data logs
          git diff --cached --quiet || { git commit -m "sync fesabal stats $(date -u +%F)"; git push; }
