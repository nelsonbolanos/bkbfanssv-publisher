name: publish-carousel

# - push: as soon as a posts/<slug>/READY file (first line YYYY-MM-DD) lands on main, it publishes every READY
#   carousel without published.json (publisher/pending.py).
# - schedule: every day 09:07 El Salvador (15:07 UTC), same thing, as a backup if the push run did not happen.
# - manual (workflow_dispatch): one manifest, dry run by default.
on:
  push:
    branches: [main]
    paths:
      - "posts/**/READY"
  schedule:
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      manifest:
        description: "Path to manifest.json inside the repo (e.g. posts/u16m-j1/manifest.json)"
        required: true
      dry_run:
        description: "Dry run (print payloads, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write   # commits published.json + log back

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      # JPEGs are served by GitHub Pages of this repo (slide paths in the manifest are relative to the repo root)
      IMAGE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      MANIFEST: ${{ inputs.manifest }}
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' && 'false' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main, so a queued run sees the published.json written by the run before it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick READY carousels (push / schedule)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          M=$(python3 publisher/pending.py carousels)
          echo "pending: ${M:-nothing}"
          echo "MANIFEST=$M" >> "$GITHUB_ENV"
      - name: Publish
        if: ${{ env.MANIFEST != '' }}
        run: |
          mkdir -p logs
          if [ "$DRY_RUN" = "true" ]; then FLAG=--dry-run; else FLAG=; fi
          rc=0
          for m in $MANIFEST; do
            echo "== $m"
            python3 -u publisher/publish.py "$m" $FLAG 2>&1 | tee -a logs/run-${{ github.run_id }}.txt
            [ "${PIPESTATUS[0]}" = 0 ] || rc=1
            sleep 30   # spread the API calls of several carousels
          done
          exit $rc
      - name: Save published.json + log
        if: ${{ always() && env.MANIFEST != '' }}
        run: |
          git config user.name "bkbfanssv-bot"
          git config user.email "bkbfanssv-bot@users.noreply.github.com"
          git add -A posts logs
          git diff --cached --quiet || { git commit -m "published carousel ($GITHUB_EVENT_NAME): $MANIFEST"; git pull --rebase -q; git push; }
