name: publish-carousel

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Path to manifest.json inside the repo (e.g. posts/u16m-j1/manifest.json)"
        required: true
      dry_run:
        description: "Dry run (print payloads, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write   # commits published.json + log back

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      # JPEGs are served by GitHub Pages of this repo (slide paths in the manifest are relative to the repo root)
      IMAGE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      MANIFEST: ${{ inputs.manifest }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish
        run: |
          mkdir -p logs
          if [ "$DRY_RUN" = "true" ]; then FLAG=--dry-run; else FLAG=; fi
          python3 -u publisher/publish.py "$MANIFEST" $FLAG 2>&1 | tee logs/run-${{ github.run_id }}.txt; exit ${PIPESTATUS[0]}
      - name: Save published.json + log
        if: ${{ always() }}
        run: |
          git config user.name "bkbfanssv-bot"
          git config user.email "bkbfanssv-bot@users.noreply.github.com"
          git add -A posts logs
          git diff --cached --quiet || { git commit -m "published carousel: $MANIFEST"; git push; }
