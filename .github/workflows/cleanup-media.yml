name: cleanup-media

# Removes published media older than 7 days so the public repo does not keep an archive of photos.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old media
        run: |
          python3 - <<'PY'
          import os, re, shutil, datetime, json
          cut = datetime.date.today() - datetime.timedelta(days=7)
          for d in sorted(os.listdir("stories")) if os.path.isdir("stories") else []:
              if re.fullmatch(r"\d{4}-\d\d-\d\d", d) and datetime.date.fromisoformat(d) < cut:
                  shutil.rmtree(os.path.join("stories", d)); print("removed stories/" + d)
          for root in ("images",):
              if not os.path.isdir(root): continue
              for slug in os.listdir(root):
                  pub = os.path.join("posts", slug, "published.json")
                  if os.path.exists(pub):
                      at = json.load(open(pub)).get("at", "")[:10]
                      if at and datetime.date.fromisoformat(at) < cut:
                          shutil.rmtree(os.path.join(root, slug)); print("removed images/" + slug)
          PY
          git config user.name "bkbfanssv-bot"; git config user.email "bkbfanssv-bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || { git commit -m "cleanup old media"; git push; }
